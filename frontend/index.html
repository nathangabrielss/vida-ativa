<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vida Ativa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="center">
      <div class="brand-mark" style="font-size:3rem">🌿</div>
      <h1>Vida Ativa</h1>
      <p class="muted">Carregando…</p>
    </div>
  </div>
  <script>
    fetch('/api/me', { credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then((r) => (r.ok ? r.json() : null))
      .then((u) => {
        if (!u) { location.replace('/login'); return; }
        if (u.mustChangePassword) { location.replace('alterar-senha.html?forced=1'); return; }
        location.replace(u.role === 'admin' ? 'admin.html' : 'inicio.html');
      })
      .catch(() => location.replace('/login'));
  </script>
</body>
</html>
